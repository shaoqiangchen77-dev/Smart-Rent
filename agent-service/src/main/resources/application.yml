server:
  port: 8085

spring:
  application:
    name: agent-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/agent_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        enabled: false
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yml
        import-check:
          enabled: false

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

langchain4j:
  open-ai:
    chat-model:
      api-key: ${LLM_API_KEY:your-api-key}
      model-name: qwen-plus
      base-url: https://dashscope.aliyuncs.com/api/v1
      log-requests: true
      log-responses: true
